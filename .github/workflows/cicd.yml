name: DVWA CI/CD Pipeline

on:
  push:
    branches:
      - MALITH
  pull_request:
    branches:
      - MALITH

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker images
        run: docker compose -f compose.yml build

      - name: Start DVWA and database
        run: docker compose -f compose.yml up -d

      - name: Wait for services
        run: sleep 15

      - name: Check running containers
        run: docker compose -f compose.yml ps

      - name: Test DVWA is running
        run: curl --fail http://localhost:4280

      - name: Show logs if tests fail
        if: failure()
        run: docker compose -f compose.yml logs

      - name: Stop services
        if: always()
        run: docker compose -f compose.yml down
