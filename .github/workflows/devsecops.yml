name: DevSecOps Security Pipeline

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  # Gate 1: Secrets Scanning
  secrets-scan:
    name: "Gate 1: Secrets Scanning (Gitleaks)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Gate 2: SAST Scanning
  sast-scan:
    name: "Gate 2: SAST (Semgrep)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Run Semgrep SAST
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" returntocorp/semgrep \
            semgrep scan --config auto /src

  # Gate 3: Dependency / SCA Scanning
  sca-scan:
    name: "Gate 3: Dependency Scanning (SCA)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Run Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

  # Gate 4: Container Image Security Scan (Enforces Build Failure)
  container-scan:
    name: "Gate 4: Container Image Scanning (Trivy)"
    runs-on: ubuntu-latest
    needs: [secrets-scan, sast-scan]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t dvwa-local:${{ github.sha }} .

      - name: Scan Container Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'dvwa-local:${{ github.sha }}'
          format: 'table'
          exit-code: '1' # Configured to actively FAIL the pipeline on critical issues
          severity: 'CRITICAL'
