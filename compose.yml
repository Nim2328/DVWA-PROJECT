services:
  dvwa:
    build: .
    container_name: dvwa
    ports:
      - "4280:80"
    depends_on:
      - db
    networks:
      - dvwa-network

  db:
    image: mariadb:10.11
    container_name: dvwa-db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: dvwa
      MYSQL_USER: dvwa
      MYSQL_PASSWORD: dvwa_password
    volumes:
      - dvwa-db-data:/var/lib/mysql
    networks:
      - dvwa-network

volumes:
  dvwa-db-data:

networks:
  dvwa-network:
