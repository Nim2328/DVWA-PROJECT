```yaml
name: DVWA DevSecOps Security Pipeline

on:
  push:
    branches:
      - main
      - NIRMAL
      - MALITH

  pull_request:
    branches:
      - main

jobs:

  # ==========================================
  # BUILD
  # ==========================================
  build:
    name: Build Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build DVWA Docker image
        run: docker build -t dvwa-security-scan .


  # ==========================================
  # SAST - SEMGREP
  # ==========================================
  sast:
    name: SAST - Semgrep
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install Semgrep
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install semgrep

      - name: Run Semgrep
        run: |
          semgrep scan \
            --config p/php \
            --error \
            vulnerabilities/


  # ==========================================
  # SCA - TRIVY FILESYSTEM
  # ==========================================
  sca:
    name: SCA - Trivy Filesystem
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Run Trivy filesystem vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true


  # ==========================================
  # SECRETS SCAN - GITLEAKS
  # ==========================================
  secrets:
    name: Secrets Scan - Gitleaks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  # ==========================================
  # CONTAINER SCAN - TRIVY
  # ==========================================
  container-scan:
    name: Container Scan - Trivy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build DVWA Docker image
        run: docker build -t dvwa-security-scan .

      - name: Run Trivy container vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: dvwa-security-scan
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
```


